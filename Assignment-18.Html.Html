<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-18</title>
</head>
<body>
     <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        header, footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }

        main {
            width: 70%;
            margin: auto;
        }

        table {
            width: 80%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
        }

        th {
            background-color: lightblue;
        }

        fieldset {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>

        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>

            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>

            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>₹45,000</td>
            </tr>
        </table>

        <form action="#" method="post">

            <fieldset>
                <legend>Application Form</legend>

                <label>Name:</label><br>
                <input type="text" required>
                <br><br>

                <label>Email:</label><br>
                <input type="email" required>
                <br><br>

                <label>Course:</label><br>

                <select>
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select>

                <br><br>

                <label>Statement:</label><br>

                <textarea rows="4" cols="40"></textarea>

                <br><br>

                <input type="submit" value="Apply">

            </fieldset>

        </form>

    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>
</body>
</html>
